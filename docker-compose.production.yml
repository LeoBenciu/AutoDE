name: autoimport

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: eu-central-1
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  FINOVA_EXTRACTION_LLM_MODEL: ${FINOVA_EXTRACTION_LLM_MODEL:-gpt-4o-mini-2024-07-18}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-eu-central-1}
  ANAF_TOKEN_URL: ${ANAF_TOKEN_URL:-https://logincert.anaf.ro/anaf-oauth2/v1/token}
  ANAF_ETRANSPORT_BASE_URL: ${ANAF_ETRANSPORT_BASE_URL:-https://api.anaf.ro/test/ETRANSPORT/ws/v1}
  ANAF_CLIENT_ID: ${ANAF_CLIENT_ID:-}
  ANAF_CLIENT_SECRET: ${ANAF_CLIENT_SECRET:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  createbucket:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  migrate:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: autoimport-backend:${IMAGE_TAG:-local}
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: autoimport-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: autoimport-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    image: autoimport-backup:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BACKUP_ROOT: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
  backups:
