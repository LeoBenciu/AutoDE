segment_batch_task:
  description: >
    You are looking at ONE scanned PDF of {total_pages} pages that may contain
    SEVERAL separate accounting documents scanned in a stack (invoices, receipts,
    fiscal receipts, bank statements, contracts, Z reports, cash dispositions,
    CMRs and vehicle registration certificates).
    Group consecutive pages into logical documents. Pages are provided in order,
    each labeled "=== PAGE i of N ===" with its thumbnail image and, when the PDF
    has a text layer, a snippet of its text (scans usually have no text — read
    the images).

    A page CONTINUES the previous document (do NOT start a new segment) when:
    - it shows "Pagina X din Y" / "Page X of Y" with X > 1, or any page-numbering
      carry-over from the previous page;
    - a table continues without a new document header (e.g. a bank statement's
      transaction list with a running "Sold"/balance column, or an invoice's line
      items continuing);
    - it repeats the same serie/număr (document number) as the previous page;
    - it shows "REPORT"/"Report pagina" carry-over rows, or contains only
      totals/signatures that close the document started before.

    A page STARTS a new document when:
    - a new vendor letterhead/logo/company header appears;
    - a new document title appears: FACTURĂ / FACTURA, CHITANȚĂ / CHITANTA,
      BON FISCAL, EXTRAS DE CONT, CONTRACT, RAPORT Z, DISPOZIȚIE DE PLATĂ,
      DISPOZIȚIE DE ÎNCASARE, CMR, or
      Zulassungsbescheinigung/Fahrzeugbrief/talon;
    - a fresh document number and date appear at the top of the page;
    - the document type visibly changes (e.g. a receipt after an invoice).

    CRITICAL tie-break rule: dacă nu ești sigur că o pagină începe un document
    nou, tratează-o ca o CONTINUARE a documentului precedent (merge). A wrong
    split corrupts bookkeeping; a wrong merge is recoverable. Reflect any
    remaining doubt in that segment's confidence score, NOT by inventing extra
    boundaries. A single multi-page document is a perfectly good answer:
    one segment covering pages 1-{total_pages}.

    For each segment report doc_type_hint (Invoice, Receipt, Bank Statement,
    Contract, Z Report, Payment Disposition, Collection Disposition, or Unknown)
    plus CMR and Vehicle Registration Certificate
    and confidence (0.0-1.0) that the segment is a SEPARATE document with these
    exact boundaries.

    The segments MUST cover ALL {total_pages} pages, in order, with no gaps and
    no overlaps: the first segment starts at page 1, each next segment starts at
    the previous end_page + 1, and the last segment ends at page {total_pages}.

    Return JSON matching the schema: total_pages, segments (each with
    start_page, end_page, doc_type_hint, confidence).
    Example for a 5-page file holding an invoice (pages 1-2) and two receipts:
    {"total_pages": 5, "segments": [{"start_page": 1, "end_page": 2,
    "doc_type_hint": "Invoice", "confidence": 0.93}, {"start_page": 3,
    "end_page": 3, "doc_type_hint": "Receipt", "confidence": 0.9},
    {"start_page": 4, "end_page": 5, "doc_type_hint": "Receipt",
    "confidence": 0.82}]}
  expected_output: >
    JSON with total_pages and an ordered, gapless, non-overlapping segments array.
  agent: document_categorizer
